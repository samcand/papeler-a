# Publica las dos apps en GitHub Pages.
#
# No hay nada que compilar: son archivos estáticos, así que se sube el
# repositorio tal cual. La app de alabanza queda en la raíz y la de
# recordatorios en /recordatorios/.
#
# El propio flujo enciende Pages la primera vez (enablement), así que no hay
# que tocar nada en Settings.
name: Publicar en GitHub Pages

on:
  push:
    branches:
      - claude/custom-reminders-app-3rp0y4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos cambios seguidos, se publica el último y se deja el anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Sin dependencias que instalar: las pruebas son node a secas.
      - run: npm test

  publicar:
    needs: pruebas
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Enciende Pages en el repositorio si todavía no lo estaba.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: despliegue
        uses: actions/deploy-pages@v4
