<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proyección — Alabanza</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #000; color: #fff;
      font: 400 16px/1.3 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    #proyeccion { height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 4vh 5vw; text-align: center; }
    #proyeccion.negro { background: #000; }
    .letra { display: flex; flex-direction: column; gap: .3em; text-shadow: 0 2px 18px rgba(0,0,0,.9); }
    .letra p { margin: 0; font-weight: 600; letter-spacing: .01em; }
    .letra p.espacio { height: .5em; }
    .pie { position: fixed; bottom: 2vh; left: 0; right: 0; text-align: center;
      font-size: 1.6vw; color: #8a8f98; letter-spacing: .12em; text-transform: uppercase; }
    .ayuda { position: fixed; top: 2vh; right: 2vw; font-size: 1.2vw; color: #4a4f57; }
  </style>
</head>
<body>
  <div id="proyeccion"></div>
  <div class="ayuda">F: pantalla completa · Esc: salir</div>
  <script type="module" src="src/proyeccion.js"></script>
</body>
</html>
